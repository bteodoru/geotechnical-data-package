[project]
name = "gdp"
version = "0.1.0"
description = "GDP (Geotechnical Data Package) reference tools: validator and SQLite importer"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
